# ============================================
# Global scope / exclusions
# ============================================
files: |
  (?x)^(
    backend/|
    frontend/|
    targets/|
    docs/|
    config/|
    (Cargo\.toml|
     Cargo\.lock|
     Makefile|
     README\.md|
     CLAUDE\.md|
     LICENSE(\.txt)?|
     Dockerfile|
     docker-compose\.yml|
     config\.toml|
     \.pre-commit-config\.yaml|
     \.gitignore)
  )

exclude: |
  (?x)^(
    backend/target/|
    backend/target-test/|
    backend/target-bench/|
    frontend/node_modules/|
    frontend/dist/|
    data/|
    \.git/|
    Cargo\.lock$
  )

# ============================================
# Hooks
# ============================================
repos:
  # -----------------------
  # General hygiene checks
  # -----------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  # --------------------------------------
  # JS/TS/CSS/HTML/JSON/YAML/MD via Prettier
  # --------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|css|html|json|yaml|yml|md)$
        # Honor frontend/.prettierrc if present; otherwise prettier defaults
        exclude: ^frontend/dist/

  # -----------------
  # Markdown linting
  # -----------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        # Lenient defaults: zenith docs aren't strict-markdownlint compliant
        # because they use HTML escapes and code blocks heavily, and many
        # code blocks are mixed-content terminal sessions where a single
        # language tag isn't accurate.
        args:
          - "--disable"
          - "MD013" # line length
          - "MD024" # duplicate headings (repeating subsections)
          - "MD033" # inline HTML (<br>, <details>, etc.)
          - "MD040" # fenced-code-language (terminal sessions are mixed)
          - "MD041" # first line should be h1 (some docs start with frontmatter)
          - "--"

  # -----------------
  # Dockerfile lint
  # -----------------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args:
          - "--ignore=DL3008" # apt-get without version pin (accept latest)
          - "--ignore=DL3009" # delete apt lists (done in same RUN)

  # ======================================
  # Local hooks (system-installed tools)
  # ======================================
  - repo: local
    hooks:
      # ----- Rust: cargo fmt -----
      # Runs `cargo fmt` against the whole backend crate when any
      # backend Rust file changes. We don't pass individual file names
      # because cargo-fmt expects paths relative to the manifest dir
      # and pre-commit gives us paths from the repo root.
      - id: cargo-fmt-local
        name: cargo fmt (backend)
        entry: bash -c 'cd backend && cargo fmt'
        language: system
        files: ^backend/.*\.rs$
        pass_filenames: false

      # ----- Rust: cargo clippy (warning -> error) -----
      # Disabled by default in pre-commit because clippy can take 30s+ on
      # cold cache. Run via `make lint` or in CI. Uncomment to enable for
      # local commits.
      # - id: cargo-clippy-local
      #   name: cargo clippy (backend)
      #   entry: bash -c 'cd backend && cargo clippy --lib --bins -- -D warnings'
      #   language: system
      #   files: ^backend/.*\.rs$
      #   pass_filenames: false

      # ----- ASCII only enforcement -----
      # Catches accidental smart quotes, em-dashes, and emoji at commit
      # time. All zenith source and docs must be plain ASCII.
      - id: ascii-only
        name: ASCII-only check
        entry: bash -c 'fail=0; for f in "$@"; do if LC_ALL=C grep -lP "[^\x00-\x7F]" "$f" >/dev/null 2>&1; then echo "non-ASCII in $f:"; LC_ALL=C grep -nP "[^\x00-\x7F]" "$f" | head -5; fail=1; fi; done; exit $fail' --
        language: system
        files: \.(rs|ts|tsx|js|jsx|css|md|toml|yaml|yml|json|sh)$
        exclude: ^(backend/target|frontend/node_modules|frontend/dist|data)/

      # ----- TODO/FIXME/HACK forbidden -----
      # Production code should be complete or have a tracked ticket,
      # not a comment marker. Test files are excluded so they can use
      # comment markers describing what's being asserted.
      - id: no-todo-fixme
        name: forbid TODO/FIXME/HACK comments
        entry: bash -c 'fail=0; for f in "$@"; do if grep -nE "(TODO|FIXME|XXX|HACK)([:( ]|$)" "$f" >/dev/null 2>&1; then echo "TODO/FIXME in $f:"; grep -nE "(TODO|FIXME|XXX|HACK)([:( ]|$)" "$f" | head -3; fail=1; fi; done; exit $fail' --
        language: system
        files: ^(backend/src|backend/benches|frontend/src)/.*\.(rs|ts|tsx)$
        exclude: \.(test|spec)\.(ts|tsx|rs)$

      # NOTE: tsc -b strict-mode type-checking is intentionally NOT in
      # pre-commit. It requires Node on the host (we run frontend tooling
      # in Docker per the project convention) and adds 5+ seconds per
      # commit. The same check runs as part of `make build` and on CI.
      # If you want it locally, install node and run `cd frontend && npx tsc -b`.
