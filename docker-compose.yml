services:
  # Production runtime
  zenith:
    build: .
    # Host networking: target definitions in config.toml fully
    # describe each link's transport (dials, listens, ports), and
    # the transport layer binds exactly what they declare -- no
    # per-target deployment config here, ever. Zenith itself serves
    # one port, the HTTP/WebSocket front door ([server] in
    # config.toml, default 8080).
    network_mode: host
    volumes:
      - zenith-data:/var/lib/zenith
      - ./config.toml:/etc/zenith/config.toml:ro
      - ./targets:/data/targets:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8080/api/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Development (build, test, lint, bench)
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    volumes:
      - .:/build
    working_dir: /build
    command: bash

volumes:
  zenith-data:
