services:
  # Production runtime
  zenith:
    build: .
    # Host networking: target definitions in config.toml fully
    # describe each link's transport (dials, listens, ports), and
    # the transport layer binds exactly what they declare -- no
    # per-target deployment config here, ever. Zenith itself serves
    # one port, the HTTP/WebSocket front door ([server] in
    # config.toml, default 8080).
    network_mode: host
    # The entrypoint starts as root only to hand the data volume to the
    # zenith user (uid 10001) and switch to it; these are the capabilities
    # it uses, and the server keeps none.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    # The root filesystem is read-only: the server writes only the data
    # volume below, where SQLite also keeps its temporary files.
    read_only: true
    volumes:
      - zenith-data:/var/lib/zenith
      - ./config.toml:/etc/zenith/config.toml:ro
      - ./targets:/data/targets:ro
    # The image carries its health check (zenith --health-check).
    restart: unless-stopped

  # Development (build, test, lint, bench)
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    volumes:
      - .:/build
    working_dir: /build
    command: bash

volumes:
  zenith-data:
