[package]
name = "zenith"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Real-time operations interface for Apex CSF applications"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
# float_roundtrip: a JSON number reads back as the exact double it was
# written as; the default parse can land a unit in the last place off,
# and a tunable double the console sends back unedited must keep its
# bytes
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Auth
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
# Browser session ids are stored as SHA-256 digests, never in the clear
sha2 = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
socket2 = "0.5"
thiserror = "2"
base64 = "0.22"

[lib]
name = "zenith"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.14", features = ["criterion", "flamegraph"] }
tempfile = "3"
# A WebSocket client for the telemetry socket tests (both crates are
# already in the tree through axum's WebSocket support)
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Requests answered by the server's router in process, for the
# handler and middleware tests in main.rs (already in the tree
# through axum)
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "decoder"
harness = false

[[bin]]
name = "zenith"
path = "src/main.rs"
