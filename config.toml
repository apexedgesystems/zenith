# Zenith Configuration

[server]
host = "0.0.0.0"
port = 8080

[auth]
enabled = false
secret = "change-me-in-production"

[storage]
# Absolute path inside the persistent volume (zenith-data mounts at
# /var/lib/zenith in docker-compose.yml). A relative path here resolves
# against the container's working directory and lands outside the
# volume, so history would not survive container recreation.
path = "/var/lib/zenith/zenith.db"
retention_hours = 24
# max_db_size_mb = 2048    # size cap before FIFO eviction (default 2048)
# fifo_strategy = "fair"   # "fair" waterlines evictions across targets
#                          # so a chatty target cannot evict a quiet
#                          # one's history; "global" is owner-blind

# Target: Local SIL ops demo (dev only; 172.21.0.1 is the compose
# network gateway, i.e. this host as seen from the zenith container)
[[targets]]
name = "Local SIL - Ops Demo"
host = "172.21.0.1"
port = 9000
auto_connect = false
manifest = "/data/targets/sil-ops-demo/app_manifest.json"
structs_dir = "/data/targets/sil-ops-demo/structs"
telemetry_config = "/data/targets/sil-ops-demo/telemetry.json"
commands_config = "/data/targets/sil-ops-demo/commands.json"

