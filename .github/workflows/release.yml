# ==============================================================================
# Release -- Build and publish container image on version tag
#
# Triggered by pushing a version tag (v*). Builds the production Docker
# image and publishes it to GitHub Container Registry (ghcr.io).
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces:
#   ghcr.io/<owner>/zenith:v0.1.0
#   ghcr.io/<owner>/zenith:latest
# ==============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
