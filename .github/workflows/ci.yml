# ==============================================================================
# CI -- Build, test, and lint on pull requests to main
#
# Runs all checks inside the dev Docker Compose service (Rust + Node).
# The production image is built as a final step and booted as docker run
# boots it with no mounts and no environment (make smoke-boot), so its
# bundled config and demo targets are what boots; docs/TESTING.md lists
# what the smoke checks it serves. A second job scans the tree and the
# pull request's commits for secrets (make secret-scan, rules in
# .gitleaks.toml).
# ==============================================================================
name: CI

# Pull requests are the gate; a merged commit has already passed as
# the PR it came from. Manual dispatch covers re-runs on demand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build dev image
        run: docker compose build dev

      - name: Backend tests
        run: docker compose run --rm -T dev bash -c 'cd backend && cargo test --lib --locked'

      - name: Frontend tests
        run: docker compose run --rm -T dev bash -c 'cd frontend && npm ci && npm run test'

      - name: Clippy
        run: docker compose run --rm -T dev bash -c 'cd backend && cargo clippy --all-targets --locked -- -D warnings'

      - name: ESLint
        run: docker compose run --rm -T dev bash -c 'cd frontend && npx eslint . --max-warnings 200'

      - name: Cargo fmt check
        run: docker compose run --rm -T dev bash -c 'cd backend && cargo fmt -- --check'

      - name: Build production image
        run: docker compose build zenith

      - name: Smoke-boot the production image
        run: make smoke-boot

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the pull request's commits are scanned, not only
          # the tree they produce.
          fetch-depth: 0

      - name: Scan the tree and the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            make secret-scan SECRET_SCAN_RANGE="$BASE_SHA..$HEAD_SHA"
          else
            make secret-scan
          fi
