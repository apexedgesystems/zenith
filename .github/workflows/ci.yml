# ==============================================================================
# CI -- Build, test, and lint on pull requests to main
#
# The tests, lint and format check are Makefile targets, run inside the
# dev Docker Compose service (Rust + Node). The tests run once,
# instrumented (make coverage): the per-file coverage tables go to the job
# summary and the report is uploaded as the coverage artifact (14 days).
# The production image is built as a final step and booted as docker run
# boots it with no mounts and no environment (make smoke-boot), so its
# bundled config and demo targets are what boots; docs/TESTING.md lists
# what the smoke checks it serves. A second job scans the tree and the
# pull request's commits for secrets (make secret-scan, rules in
# .gitleaks.toml).
# ==============================================================================
name: CI

# Pull requests are the gate; a merged commit has already passed as
# the PR it came from. Manual dispatch covers re-runs on demand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build dev image
        run: docker compose build dev

      # A failing test fails this step; -k lets the other half still run
      # and write its report.
      - name: Tests with coverage
        run: make -k coverage

      - name: Coverage summary
        if: always()
        run: make coverage-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Lint
        run: make lint

      - name: Cargo fmt check
        run: make fmt-check

      - name: Build production image
        run: docker compose build zenith

      - name: Smoke-boot the production image
        run: make smoke-boot

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the pull request's commits are scanned, not only
          # the tree they produce.
          fetch-depth: 0

      - name: Scan the tree and the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            make secret-scan SECRET_SCAN_RANGE="$BASE_SHA..$HEAD_SHA"
          else
            make secret-scan
          fi
