# Dependency-update PRs, grouped per ecosystem so review stays
# deliberate rather than a PR firehose. The cooldown waits out fresh
# releases before proposing them (supply-chain posture: a brand-new
# version has had no soak time).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor+patch only: majors fall out of the group and arrive as
      # individual PRs, each proving itself against CI alone. Keeps
      # us current without letting one incompatible major (or a
      # peer conflict dependabot never cross-solves) sink a bundle
      # of routine updates.
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # TypeScript majors wait for typescript-eslint: its peer range
    # excludes typescript 7, so a solo bump can never install. Delete
    # this entry when typescript-eslint declares support.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Packages whose peer ranges bind them to each other move
      # together, majors included: a solo major of one half cannot
      # resolve against the other half, and dependabot does not
      # cross-solve peers between separate PRs. Family groups are
      # matched first.
      vite:
        patterns: ["vite", "@vitejs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Everything else minor+patch only, for the same reason as
      # cargo: one unresolvable peer conflict must not hold a whole
      # group of routine updates. Remaining majors arrive solo and
      # prove themselves against CI alone.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The pinned rust/node/debian base images: bumps arrive as PRs
  # instead of silently via floating tags.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-dev:
        patterns: ["*"]
