# Dependency-update PRs, grouped per ecosystem so review stays
# deliberate rather than a PR firehose. The cooldown waits out fresh
# releases before proposing them (supply-chain posture: a brand-new
# version has had no soak time).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor+patch only: majors fall out of the group and arrive as
      # individual PRs, each proving itself against CI alone. Keeps
      # us current without letting one incompatible major (or a
      # peer conflict dependabot never cross-solves) sink a bundle
      # of routine updates.
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Same minor+patch scoping as cargo, and for the same reason:
      # the first grouped npm PR died on an unsolvable peer conflict
      # (typescript 7 vs typescript-eslint <6.1.0) that took 18
      # innocent updates down with it.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The pinned rust/node/debian base images: bumps arrive as PRs
  # instead of silently via floating tags.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-dev:
        patterns: ["*"]
