# Zenith Configuration

[server]
host = "0.0.0.0"
port = 8080

[auth]
enabled = false
secret = "change-me-in-production"

[storage]
path = "./data/zenith.db"
retention_hours = 24
# Path to struct dictionaries (JSON files from apex_data_gen)
# structs_dir = "/path/to/apex_data_db"

# Target: Raspberry Pi
[[targets]]
name = "Pi - Ops Demo"
host = "raspberrypi.local"
port = 9000
auto_connect = false

